name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  flake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Flake check
        run: nix flake check

      - name: Format check
        run: |
          nix fmt .
          git diff --exit-code -- '*.nix' flake.nix

      - name: Build default package
        run: nix build

      - name: Build gopdf
        run: nix build .#gopdf

      - name: Build reasongraph
        run: nix build .#reasongraph
