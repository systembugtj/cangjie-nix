name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  flake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      - name: Flake check
        run: nix flake check

      - name: Format check
        run: |
          nix fmt .
          git diff --exit-code -- '*.nix' flake.nix

      - name: Build default package
        run: nix build

      - name: Build gopdf
        run: nix build .#gopdf

      - name: Build reasongraph
        run: nix build .#reasongraph

      - name: Build issuegraph
        run: nix build .#issuegraph

  ghostty:
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      - name: Build Ghostty packages
        run: nix build -L .#ghostty .#libghostty-vt
